name: Release

# Tag-triggered release pipeline for HomeRoll.
# On `v*` tag push:
#   1. creates the GitHub Release and uploads deploy assets
#      (docker-compose.yml + example.env, consumed by install.sh via
#      releases/latest/download)
#   2. builds signed Android APK (universal + per-ABI) and AAB from the
#      release keystore secrets, then attaches them to the release
#   3. builds and pushes GHCR images: homeroll-server,
#      homeroll-machine-learning (tags: release, latest, <semver>)
#
# Required secrets (provisioned in Phase 10): RELEASE_KEYSTORE,
# RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD, RELEASE_STORE_PASSWORD.
# GHCR push uses GITHUB_TOKEN with packages:write — no extra secret.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (re-run release jobs)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  GHCR: ghcr.io/${{ github.repository_owner }}

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
          token: ${{ github.token }}

      - name: Verify tag exists
        run: git rev-parse -q --verify "refs/tags/${{ env.TAG }}" >/dev/null || { echo "Tag ${{ env.TAG }} does not exist"; exit 1; }

      - name: Create release and upload deploy assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "HomeRoll $TAG" --generate-notes
          cp docker/example.env example.env
          gh release upload "$TAG" docker/docker-compose.yml example.env install.sh --clobber

  docker-server:
    name: Publish homeroll-server image
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
          token: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.GHCR }}/homeroll-server
          tags: |
            type=raw,value=release
            type=raw,value=latest
            type=raw,value=${{ env.TAG }}

      - name: Build and push homeroll-server
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_ID=${{ github.run_id }}
            BUILD_IMAGE=${{ env.GHCR }}/homeroll-server
            BUILD_SOURCE_REF=${{ env.TAG }}
            BUILD_SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-machine-learning:
    name: Publish homeroll-machine-learning image
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
          token: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.GHCR }}/homeroll-machine-learning
          tags: |
            type=raw,value=release
            type=raw,value=latest
            type=raw,value=${{ env.TAG }}

      - name: Build and push homeroll-machine-learning (cpu)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./machine-learning
          file: ./machine-learning/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DEVICE=cpu
            BUILD_ID=${{ github.run_id }}
            BUILD_IMAGE=${{ env.GHCR }}/homeroll-machine-learning
            BUILD_SOURCE_REF=${{ env.TAG }}
            BUILD_SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android:
    name: Build signed Android APK + AAB
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
          token: ${{ github.token }}

      - name: Restore Rust Cache
        id: cache-rust-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: mobile-rust-${{ runner.os }}-${{ hashFiles('native/crates/native_core_ffi/rust-toolchain.toml', 'mobile/mise.lock', 'native/Cargo.lock') }}
          restore-keys: |
            mobile-rust-${{ runner.os }}-

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@caac7f7e4298458a14238959504f411fc6cc7f06 # use-mise-action-v3.2.3
        with:
          github_token: ${{ github.token }}
          working_directory: ./mobile

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ''

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        working-directory: ./mobile
        run: |
          printf "%s" "$RELEASE_KEYSTORE" | base64 -d > android/key.jks
          test -s android/key.jks || { echo "RELEASE_KEYSTORE secret missing or empty"; exit 1; }

      - name: Install dependencies
        run: mise //mobile:install:ci

      - name: Perform codegen
        run: mise //mobile:codegen

      - name: Build release APKs and AAB
        working-directory: ./mobile
        env:
          ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          [ -n "$ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ] && [ -n "$ANDROID_STORE_PASSWORD" ] || { echo "Release signing secrets incomplete"; exit 1; }
          flutter build apk --release
          flutter build apk --release --split-per-abi
          flutter build appbundle --release

      - name: Upload binaries to release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ./mobile/build/app/outputs
        run: |
          cd flutter-apk
          cp app-release.apk "homeroll-${TAG}-universal.apk"
          for f in app-*-release.apk; do
            [ "$f" = "app-release.apk" ] && continue
            abi="${f#app-}"; abi="${abi%-release.apk}"
            cp "$f" "homeroll-${TAG}-${abi}.apk"
          done
          gh release upload "$TAG" homeroll-*.apk --clobber
          cd ../bundle/release
          cp app-release.aab "homeroll-${TAG}.aab"
          gh release upload "$TAG" "homeroll-${TAG}.aab" --clobber
